name: build

# - 모든 브랜치 푸시/PR: Windows에서 포맷·Clippy·테스트(실제 Win32 API 통합 테스트 포함)와 릴리스 빌드
# - v* 태그 푸시: 위 과정 후 AppDeleter.exe를 GitHub Release에 업로드
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Lint & test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: test

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # --include-ignored: 파일 시스템·HKCU·프로세스를 실제로 쓰는 통합/종단 간 테스트까지 실행
      - name: test
        run: cargo test --locked -- --include-ignored

  release:
    name: Release build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      # 코드 서명용(선택). 저장소 Secrets에 설정하면 SmartScreen 경고 완화를 위해 서명한다.
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: cargo build --release
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\app-deleter.exe dist\AppDeleter.exe
          Get-Item dist\AppDeleter.exe | Format-List Name, Length

      - name: Code sign (optional)
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 dist\AppDeleter.exe
          Remove-Item $pfx

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\AppDeleter.exe -Algorithm SHA256).Hash
          "$hash  AppDeleter.exe" | Out-File -Encoding ascii dist\AppDeleter.exe.sha256
          Get-Content dist\AppDeleter.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AppDeleter
          path: dist/*

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
