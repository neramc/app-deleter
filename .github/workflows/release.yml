name: release

# 빌드가 시작되면 다음 버전 태그(vX.Y.Z)를 자동 계산·푸시하고,
# 메인 앱(app-deleter.exe)과 그 앱을 임베드한 커스텀 설치 마법사
# (App Deleter Setup, NSIS 비의존)를 빌드해 GitHub Release에 업로드한다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "버전 증가 단위"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and push next version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "푸시된 태그 사용: ${{ github.ref_name }}"
            exit 0
          fi
          git fetch --tags --quiet || true
          latest=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [ -z "$latest" ]; then
            base=$(node -p "require('./src-tauri/tauri.conf.json').version")
            major=${base%%.*}; rest=${base#*.}; minor=${rest%%.*}; patch=${rest##*.}
          else
            ver=${latest#v}
            major=${ver%%.*}; rest=${ver#*.}; minor=${rest%%.*}; patch=${rest##*.}
            case "${{ github.event.inputs.bump }}" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              *)     patch=$((patch+1)) ;;
            esac
          fi
          next="v${major}.${minor}.${patch}"
          while git rev-parse "$next" >/dev/null 2>&1; do
            patch=$((patch+1)); next="v${major}.${minor}.${patch}"
          done
          echo "다음 버전 태그: $next"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./installer/src-tauri -> target

      # ── 1) 메인 앱(app-deleter.exe) 빌드 ───────────────────────────
      - name: Build main app
        run: |
          npm ci
          npm run tauri build -- --no-bundle --target x86_64-pc-windows-msvc

      # ── 2) 설치 마법사가 임베드할 페이로드로 메인 exe 복사 ───────────
      - name: Stage payload for installer
        shell: bash
        run: |
          mkdir -p installer/src-tauri/payload
          cp src-tauri/target/x86_64-pc-windows-msvc/release/app-deleter.exe \
             installer/src-tauri/payload/app-deleter.exe

      # ── 3) 커스텀 설치 마법사 빌드 ────────────────────────────────
      - name: Build installer
        working-directory: installer
        run: |
          npm ci
          npm run tauri build -- --no-bundle --target x86_64-pc-windows-msvc

      # ── 4) 산출물을 ASCII 이름으로 정리 ───────────────────────────
      - name: Collect artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          mkdir -p out
          cp installer/src-tauri/target/x86_64-pc-windows-msvc/release/app-deleter-installer.exe \
             "out/AppDeleter-Setup-${tag}.exe"
          cp src-tauri/target/x86_64-pc-windows-msvc/release/app-deleter.exe \
             "out/AppDeleter-${tag}.exe"
          ls -la out

      # ── 5) 릴리스 생성 및 업로드 ──────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "App Deleter ${{ steps.version.outputs.tag }}"
          body: |
            자동 빌드된 Windows 산출물입니다.

            - **AppDeleter-Setup-${{ steps.version.outputs.tag }}.exe** — 커스텀 설치 마법사(권장). 실행 후 설치하면 시작 메뉴·바탕화면 바로가기와 제거 정보가 등록됩니다.
            - **AppDeleter-${{ steps.version.outputs.tag }}.exe** — 설치 없이 바로 실행하는 단독 실행 파일.
          draft: false
          prerelease: false
          files: |
            out/AppDeleter-Setup-${{ steps.version.outputs.tag }}.exe
            out/AppDeleter-${{ steps.version.outputs.tag }}.exe
