name: release

# v* 태그를 푸시하면 Windows 바이너리를 빌드하고 GitHub Release에 업로드한다.
# 수동 실행(workflow_dispatch)도 지원한다.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 태그 푸시면 그 태그를, 수동 실행이면 app-v<version>을 사용.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('app-v{0}', github.run_number) }}
          releaseName: "앱 삭제 ${{ github.ref_type == 'tag' && github.ref_name || github.run_number }}"
          releaseBody: "자동 빌드된 Windows 설치 파일(NSIS .exe / MSI)입니다."
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
