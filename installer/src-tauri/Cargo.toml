[package]
name = "app-deleter-installer"
version = "1.1.0"
description = "App Deleter 설치 마법사"
authors = ["neramc"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_deleter_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
