[package]
name = "app-deleter"
version = "0.1.0"
description = "Windows 앱 삭제 애플리케이션"
authors = ["app-deleter"]
edition = "2021"
rust-version = "1.77"

# The `_lib` suffix avoids a name collision with the binary on Windows.
[lib]
name = "app_deleter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows 전용 의존성: 레지스트리 열거 / 병렬 처리 / Win32 폴더 스캔 API
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
rayon = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
